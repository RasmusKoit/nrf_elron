# ── Elron train display (xiao_ble / nRF52840) ──────────────────────────────

CONFIG_GPIO=y
CONFIG_REBOOT=y
CONFIG_ADC=y

# ── Self-recovery: hardware watchdog reboots the SoC if the main loop ever
# wedges (deadlock/livelock/lockup). Faults are handled by the reboot-on-fatal
# override in main.c. Together these stop a "frozen, unresettable" board. ──────
CONFIG_WATCHDOG=y

# ── Display: ST7789V over SPI3 (backlight is PWM-dimmed for battery) ────────
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_PWM=y

# ── LVGL (Zephyr 3.6 / LVGL 8) ─────────────────────────────────────────────
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_VDB_SIZE=14
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# ── Bluetooth: peripheral, single connection, roomy MTU for one-shot push ──
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Elron Display"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_ATT_PREPARE_COUNT=16
CONFIG_BT_GATT_CLIENT=n

# ── Persistence: settings on NVS (survives power-cycle → offline mode) ──────
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ── USB CDC-ACM console (logs over the USB cable) ──────────────────────────
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Elron Display"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
# Reboot-to-bootloader on 1200-baud touch (hands-free flashing)
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y

# ── Logging ────────────────────────────────────────────────────────────────
CONFIG_LOG=y

# ── Memory / stacks ────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
